name: Build EZ-THEME-R

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 强制使用 Node 24

    steps:
      # 1️⃣ 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node（如果有 package.json）
      - name: Setup Node and Build
        run: |
          if [ -f package.json ]; then
            echo "package.json found, setting up Node 24 and installing dependencies"
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y nodejs
            npm install
            npm run build
          else
            echo "No package.json found, skipping Node setup"
          fi

      # 3️⃣ 打包 dist 目录成 ZIP
      - name: Zip dist directory
        run: |
          if [ -d dist ]; then
            THEME_NAME="EZ-THEME-R"
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            zip -r ${THEME_NAME}_${TIMESTAMP}.zip dist
          else
            echo "dist directory not found, skipping zip"
          fi

      # 4️⃣ 上传 artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-THEME-R-build
          path: EZ-THEME-R_*.zip

      # 5️⃣ 创建 GitHub Release 并上传 ZIP
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "EZ-THEME-R Build #${{ github.run_number }}"
          artifacts: EZ-THEME-R_*.zip
          draft: false
          prerelease: false
