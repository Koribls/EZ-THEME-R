name: Build EZ-THEME-R

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 安装依赖（如果有 package.json）
      - name: Setup Node
        if: exists('package.json')
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        if: exists('package.json')
        run: npm install

      # 3️⃣ 构建项目（dist 目录会被生成）
      - name: Build project
        if: exists('package.json')
        run: npm run build

      # 4️⃣ 打包 dist 目录成 ZIP
      - name: Zip dist directory
        run: |
          THEME_NAME="EZ-THEME-R"
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          zip -r ${THEME_NAME}_${TIMESTAMP}.zip dist

      # 5️⃣ 上传 artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-THEME-R-build
          path: EZ-THEME-R_*.zip

      # 6️⃣ （可选）创建 GitHub Release 并上传 ZIP
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "EZ-THEME-R Build #${{ github.run_number }}"
          artifacts: EZ-THEME-R_*.zip
          draft: false
          prerelease: false
