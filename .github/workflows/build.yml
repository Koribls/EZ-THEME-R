name: Build EZ-THEME-R

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 设置 Node 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3️⃣ 安装依赖并构建（如果 package.json 存在）
      - name: Install dependencies and build
        run: |
          if [ -f package.json ]; then
            echo "package.json found, installing dependencies and building"
            npm install
            npm run build
          else
            echo "No package.json found, skipping npm build"
          fi

      # 4️⃣ 打包 dist 目录
      - name: Zip dist directory
        run: |
          if [ -d dist ]; then
            THEME_NAME="EZ-THEME-R"
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            zip -r ${THEME_NAME}_${TIMESTAMP}.zip dist
          else
            echo "dist directory not found, skipping zip"
          fi

      # 5️⃣ 上传 artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-THEME-R-build
          path: EZ-THEME-R_*.zip

      # 6️⃣ 创建 GitHub Release 并上传 ZIP
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "EZ-THEME-R Build #${{ github.run_number }}"
          artifacts: EZ-THEME-R_*.zip
          draft: false
          prerelease: false
